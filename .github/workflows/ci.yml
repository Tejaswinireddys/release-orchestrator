name: CI

# Runs on every push and PR. This is the workflow that must go green.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  orchestrator:
    name: Orchestrator · build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck orchestrator
        working-directory: orchestrator
        run: npx tsc --noEmit

      - name: Build orchestrator
        working-directory: orchestrator
        run: npm run build

      - name: Unit tests
        working-directory: orchestrator
        run: npm test

      - name: End-to-end pipeline test (mock mode)
        working-directory: orchestrator
        run: npm run e2e

  ui:
    name: Agent UI · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install UI dependencies
        working-directory: ui
        run: npm install

      - name: Build Next.js dashboard
        working-directory: ui
        run: npm run build
