name: Build Packages

# Stage 1-2 of the release flow: create a "packager" set, then build a Docker
# image for EACH of the 5 packages (matrix). Images are pushed to ECR only on
# a tagged release; on branch pushes the build is validated without pushing.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version (e.g. 1.4.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: read
  id-token: write # for AWS OIDC role assumption

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}

jobs:
  packager:
    name: Resolve packager set
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set.outputs.packages }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.release_version || '0.0.0-dev' }}" >> "$GITHUB_OUTPUT"
          fi
      - id: set
        # The 5 packages that each get their own Docker build.
        run: |
          echo 'packages=["auth-service","payment-service","notification-service","inventory-service","gateway-service"]' >> "$GITHUB_OUTPUT"

  docker:
    name: Docker build · ${{ matrix.package }}
    needs: packager
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.packager.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # On a real release, authenticate to AWS + ECR via OIDC and push.
      - name: Configure AWS credentials
        if: startsWith(github.ref, 'refs/tags/v')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build (and push on release) image
        uses: docker/build-push-action@v6
        with:
          context: packages/${{ matrix.package }}
          file: packages/${{ matrix.package }}/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ${{ env.ECR_REGISTRY || 'local' }}/${{ matrix.package }}:${{ needs.packager.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
